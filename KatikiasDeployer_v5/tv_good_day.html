<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katikias 33 - Bonne Journée</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZ3JhZGllbnQiIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPgogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdHlsZT0ic3RvcC1jb2xvcjojNjY3ZWVhO3N0b3Atb3BhY2l0eToxIiAvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0eWxlPSJzdG9wLWNvbG9yOiM3NjRiYTI7c3RvcC1vcGFjaXR5OjEiIC8+CiAgICA8L2xpbmVhckdyYWRpZW50PgogIDwvZGVmcz4KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyYWRpZW50KSIvPgo8L3N2Zz4=');
            background-size: cover;
            background-position: center;
            animation: backgroundShift 20s ease-in-out infinite;
        }
        
        @keyframes backgroundShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .container {
            text-align: center;
            color: white;
            max-width: 1400px;
            padding: 60px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 2s ease-in;
        }
        
        .welcome-title { 
            font-size: 4.5rem; 
            font-weight: bold; 
            margin-bottom: 30px; 
            color: #FFD700; 
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }
        
        @keyframes titleGlow {
            from { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.3); }
            to { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 215, 0, 0.6); }
        }
        
        .subtitle { 
            font-size: 2.8rem; 
            margin-bottom: 40px; 
            color: #E0E0E0; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-style: italic;
        }
        
        .weather-info { 
            font-size: 2.2rem; 
            margin-bottom: 50px; 
            color: #B0E0E6; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        
        .qr-section { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            margin: 60px 0; 
            flex-wrap: wrap; 
            gap: 40px; 
        }
        
        .qr-item { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 15px; 
            backdrop-filter: blur(5px); 
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .qr-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .qr-label { 
            font-size: 1.8rem; 
            font-weight: bold; 
            margin-bottom: 20px; 
            color: #FFD700; 
        }
        
        .qr-code {
            background: white;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            min-width: 180px;
            min-height: 180px;
        }
        
        .qr-code img {
            width: 150px;
            height: 150px;
            border-radius: 5px;
        }
        
        .footer-message { 
            font-size: 2.2rem; 
            margin-top: 50px; 
            color: #FFD700; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-weight: bold;
        }
        
        .current-time { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            font-size: 2.5rem; 
            font-weight: bold; 
            color: #FFD700; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        
        .date-info {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        
        .fade-in { animation: fadeIn 1s ease-in; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-element:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .floating-element:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }
        
        .floating-element:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        @media (max-width: 1200px) { 
            .qr-section { flex-direction: column; } 
            .welcome-title { font-size: 3.5rem; }
            .subtitle { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>
    
    <div class="current-time" id="currentTime"></div>
    <div class="date-info" id="dateInfo"></div>
    
    <div class="container">
        <div class="welcome-title">🌟 Bonne Journée ! 🌟</div>
        <div class="subtitle">Profitez de votre séjour au Katikias 33</div>
        
        <div class="weather-info" id="weatherInfo">
            ☀️ Belle journée ensoleillée<br>
            🌡️ 22°C - Parfait pour profiter de la région
        </div>
        
        <div class="qr-section">
            <div class="qr-item">
                <div class="qr-label">📶 Wi-Fi</div>
                <div class="qr-code" id="wifiQR"></div>
            </div>
            <div class="qr-item">
                <div class="qr-label">🚨 Urgences</div>
                <div class="qr-code" id="essentialQR"></div>
            </div>
            <div class="qr-item">
                <div class="qr-label">📖 Guide Complet</div>
                <div class="qr-code" id="guideQR"></div>
            </div>
        </div>
        
        <div class="footer-message" id="footerMessage">
            Que votre journée soit merveilleuse ! ✨
        </div>
    </div>

    <script>
        // Fonction pour générer les QR codes avec qrserver.com
        function generateQRCode(text, elementId, size = 150) {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}`;
            const container = document.getElementById(elementId);
            if (container) {
                container.innerHTML = `<img src="${qrUrl}" alt="QR Code" title="${text}" style="width: ${size}px; height: ${size}px; border-radius: 5px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><div style="display:none; color:#000; font-size:12px; padding:10px;">${text}</div>`;
            }
        }

        // Fonction pour mettre à jour l'heure et la date
        function updateDateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const dateString = now.toLocaleDateString('fr-FR', { 
                weekday: 'long', 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            });
            
            document.getElementById('currentTime').textContent = timeString;
            document.getElementById('dateInfo').textContent = dateString;
        }

        // Fonction pour mettre à jour les messages selon l'heure
        function updateTimeBasedMessages() {
            const hour = new Date().getHours();
            const weatherInfo = document.getElementById('weatherInfo');
            const footerMessage = document.getElementById('footerMessage');
            
            if (hour >= 6 && hour < 12) {
                weatherInfo.innerHTML = '🌅 Belle matinée ensoleillée<br>🌡️ 22°C - Parfait pour une promenade';
                footerMessage.textContent = 'Bonne matinée ! ☀️';
            } else if (hour >= 12 && hour < 18) {
                weatherInfo.innerHTML = '☀️ Belle journée ensoleillée<br>🌡️ 25°C - Idéal pour profiter de la région';
                footerMessage.textContent = 'Excellente journée ! 🌟';
            } else if (hour >= 18 && hour < 22) {
                weatherInfo.innerHTML = '🌅 Belle soirée<br>🌡️ 20°C - Parfait pour une sortie';
                footerMessage.textContent = 'Bonne soirée ! 🌅';
            } else {
                weatherInfo.innerHTML = '🌙 Belle nuit étoilée<br>🌡️ 18°C - Repos bien mérité';
                footerMessage.textContent = 'Bonne nuit ! 🌙';
            }
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            updateDateTime();
            updateTimeBasedMessages();
            
            // Mettre à jour toutes les minutes
            setInterval(updateDateTime, 60000);
            
            // Mettre à jour les messages selon l'heure toutes les heures
            setInterval(updateTimeBasedMessages, 3600000);
            
            // Générer les QR codes
            generateQRCode('WIFI:T:WPA;S:Katikias33;P:Welcome2024!;H:false;', 'wifiQR');
            generateQRCode('tel:112\nSOS: 112\nAccès: Code 1234', 'essentialQR');
            generateQRCode('https://jfg23130.github.io/Guide-depart/index.html', 'guideQR');
        });
    </script>
</body>
</html>
