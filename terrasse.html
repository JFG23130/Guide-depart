    <script src="assets/load-guide-captions.js?v=2"></script>
    <script>
    (function(){
        const pageKey = 'terrasse';
        const exts = ['jpg','png','webp','jpeg'];
        function slugify(text){
            return text.toLowerCase()
                .normalize('NFD').replace(/\p{Diacritic}/gu,'')
                .replace(/[^a-z0-9]+/g,'_')
                .replace(/^_+|_+$/g,'')
                .replace(/_{2,}/g,'_');
        }
        function trySetImage(img, bases){
            let i = 0, j = 0;
            function next(){
                if(i >= bases.length) { img.style.display='none'; return; }
                const src = 'images/' + bases[i] + '.' + exts[j];
                const probe = new Image();
                probe.onload = function(){ img.src = src; img.style.display='block'; };
                probe.onerror = function(){ j++; if(j>=exts.length){ j=0; i++; } next(); };
                probe.src = src;
            }
            next();
        }
        function findAdditionalImages(baseName, parentWrap, captions, capKeysArr){
            // Images nom_2, nom_3… — une sonde à la fois (l’ancienne boucle lançait ~80 requêtes d’un coup → 404 partout dans la console).
            let num = 2;
            let foundAny = false;
            let consecutiveMiss = 0;
            function afterNumFailed(){
                consecutiveMiss++;
                if(foundAny && consecutiveMiss >= 2){ return; }
                num++;
                if(num > 10){ return; }
                tryVariant(0, 0);
            }
            function tryVariant(baseIdx, extIdx){
                if(foundAny && consecutiveMiss >= 2){ return; }
                const bases = [pageKey + '_' + baseName + '_' + num, baseName + '_' + num];
                if(baseIdx >= bases.length){
                    afterNumFailed();
                    return;
                }
                if(extIdx >= exts.length){
                    tryVariant(baseIdx + 1, 0);
                    return;
                }
                const src = 'images/' + bases[baseIdx] + '.' + exts[extIdx];
                const probe = new Image();
                probe.onload = function(){
                    foundAny = true;
                    consecutiveMiss = 0;
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = 'Image ' + num;
                    img.style.maxWidth = '320px';
                    img.style.maxHeight = '260px';
                    img.style.width = 'auto';
                    img.style.height = 'auto';
                    img.style.objectFit = 'contain';
                    img.style.borderRadius = '10px';
                    img.style.boxShadow = '0 4px 10px rgba(0,0,0,0.12)';
                    img.style.marginTop = '10px';
                    parentWrap.appendChild(img);
                    if(captions && captions[num - 1]){
                        const cap = document.createElement('div');
                        cap.className = 'caption';
                        cap.textContent = captions[num - 1];
                        if (capKeysArr && capKeysArr[num - 1]) {
                            cap.setAttribute('data-caption-i18n-key', capKeysArr[num - 1]);
                        }
                        parentWrap.appendChild(cap);
                    }
                    num++;
                    if(num > 10){ return; }
                    tryVariant(0, 0);
                };
                probe.onerror = function(){ tryVariant(baseIdx, extIdx + 1); };
                probe.src = src;
            }
            tryVariant(0, 0);
        }
        function runRoomPhotos(){
        document.querySelectorAll('.content ul li').forEach(li =>{
            const label = li.textContent.trim();
            const slug = slugify(label);
            const bases = [pageKey + '_' + slug, slug];
            const wrap = document.createElement('div');
            wrap.className = 'item-photo';
            const legacyPdf = (li.getAttribute('data-pdf') || '').trim();
            const perRaw = li.getAttribute('data-photo-pdfs');
            const perPdfs = perRaw ? perRaw.split('|').map(s => s.trim()) : [];
            const capKeysRaw = li.getAttribute('data-caption-keys');
            const capKeysArr = capKeysRaw ? capKeysRaw.split('|').map(function (s) { return s.trim(); }) : [];

            li.parentElement.insertBefore(wrap, li.nextSibling);
            const captionsData = li.getAttribute('data-captions');
            let captions = null;
            if(captionsData){
                captions = captionsData.split('|').map(c => c.trim());
            }
            const pathsData = li.getAttribute('data-photo-paths');
            if(pathsData && pathsData.trim()){
                const relPaths = pathsData.split('|').map(s => s.trim()).filter(Boolean);
                relPaths.forEach(function(rel, idx){
                    const pdfOneRaw = (perPdfs.length > idx && perPdfs[idx]) ? perPdfs[idx] : (!perRaw ? legacyPdf : '');
                    const pdfOne = (pdfOneRaw || '').trim();
                    let parent = wrap;
                    if(pdfOne){
                        const link = document.createElement('a');
                        link.href = pdfOne;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        link.style.cursor = 'pointer';
                        wrap.appendChild(link);
                        parent = link;
                    }
                    const src = rel.replace(/^\//,'');
                    const im = document.createElement('img');
                    im.src = src;
                    im.alt = label + (idx > 0 ? ' ('+(idx+1)+')' : '');
                    im.style.maxWidth = '320px';
                    im.style.maxHeight = '260px';
                    im.style.width = 'auto';
                    im.style.height = 'auto';
                    im.style.objectFit = 'contain';
                    im.style.borderRadius = '10px';
                    im.style.boxShadow = '0 4px 10px rgba(0,0,0,0.12)';
                    if(idx > 0){ im.style.marginTop = '10px'; }
                    if(pdfOne){ im.style.cursor = 'pointer'; }
                    parent.appendChild(im);
                    if(captions && captions[idx]){
                        const cap = document.createElement('div');
                        cap.className = 'caption';
                        cap.textContent = captions[idx];
                        if (capKeysArr[idx]) {
                            cap.setAttribute('data-caption-i18n-key', capKeysArr[idx]);
                        }
                        wrap.appendChild(cap);
                    }
                });
            } else {
            const pdfPath = legacyPdf;
            let imgParent = wrap;
            if(pdfPath){
                const link = document.createElement('a');
                link.href = pdfPath;
                link.target = '_blank';
                link.rel = 'noopener';
                link.style.cursor = 'pointer';
                wrap.appendChild(link);
                imgParent = link;
            }
            const img = document.createElement('img');
            img.alt = label;
            img.style.display = 'none';
            if(pdfPath){
                img.style.cursor = 'pointer';
            }
            imgParent.appendChild(img);
            trySetImage(img, bases);
            findAdditionalImages(slug, wrap, captions, capKeysArr);
            if(captions && captions[0]){
                const cap = document.createElement('div');
                cap.className = 'caption';
                cap.textContent = captions[0];
                if (capKeysArr[0]) {
                    cap.setAttribute('data-caption-i18n-key', capKeysArr[0]);
                }
                wrap.appendChild(cap);
            }
            }
        });
        if (typeof LanguageSystemHTML !== 'undefined') {
            LanguageSystemHTML.translatePage();
            setTimeout(function () {
                if (typeof LanguageSystemHTML !== 'undefined') {
                    LanguageSystemHTML.translatePage();
                }
            }, 700);
        }
        }
        if (typeof __guideMergeCaptionsFromJson === 'function') {
            __guideMergeCaptionsFromJson(pageKey).then(function(){ runRoomPhotos(); });
        } else {
            runRoomPhotos();
        }
    })();
    </script>
    <script>
      (function() {
        var version = 'v='+(new Date().getTime());
        function bust(u){ if(!u || u.startsWith('data:')) return u; return u + (u.indexOf('?')>=0?'&':'?') + version; }
        document.querySelectorAll('img[src]').forEach(function(img){ if(!img.src.includes('/images/')) return; img.src = bust(img.getAttribute('src')); });
      })();
    </script>

    <script>
        function changeLanguage(lang) {
            console.log('📢 changeLanguage appelé avec:', lang);
            if (typeof LanguageSystemHTML === 'undefined') {
                console.error('❌ LanguageSystemHTML non défini');
                setTimeout(() => changeLanguage(lang), 500);
                return;
            }
            LanguageSystemHTML.setLanguage(lang);
            const sel = document.getElementById('langSelector');
            if (sel) sel.value = lang;
        }
        document.addEventListener('DOMContentLoaded', () => {
            let w = 0;
            const c = setInterval(() => {
                if (typeof LanguageSystemHTML !== 'undefined') {
                    clearInterval(c);
                    const sel = document.getElementById('langSelector');
                    if (sel) sel.value = LanguageSystemHTML.currentLanguage;
                } else if (++w > 50) clearInterval(c);
            }, 100);
        });
    </script>
